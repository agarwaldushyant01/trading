# Scanner thresholds. Every number here is tunable without touching code.
# Phase 3 will tell you which of these are wrong.

universe:
  exchanges: [NASDAQ, NYSE, NYSEARCA, AMEX]   # OTC excluded by omission
  min_price: 0.10
  max_price: 20.00
  max_shares_outstanding: 30_000_000          # float proxy until real float data
  min_avg_20d_volume: 200_000                 # must be tradeable at $50k size

gap:
  # Cumulative move from prior close. Feeds pre-buy and news setups.
  min_pct_change: 3.0
  min_rel_volume: 3.0                         # vs same-time-of-day baseline
  min_session_volume: 100_000

velocity:
  # Rate of change, not cumulative. Catches the vertical premarket spike.
  # 30% inside one minute fired 4 times in 570 candidates - too rare to study.
  # A minute bar cannot show a one-second move; 12% is the equivalent signal
  # at this resolution.
  window_seconds: 60
  min_pct_change: 12.0
  min_window_volume: 50_000                   # shares traded inside the window
  min_cumulative_volume: 200_000

dedup:
  # A re-alert must be a new development, not just elapsed time. The first
  # run produced 5 alerts per symbol per day, which are not independent
  # observations and made 270 real events look like 1,365.
  cooldown_minutes: 30
  # Absolute move required since the last alert before the same name re-fires.
  reescalate_pct: 15.0
  # Ceiling per symbol PER SESSION, so premarket alerts cannot exhaust the
  # budget before the open.
  max_alerts_per_session: 3

sessions:
  premarket_start: "04:00"
  regular_open: "09:30"
  regular_close: "16:00"
  afterhours_end: "20:00"
  # Sessions the scanner will emit candidates for. After-hours is excluded:
  # it produced a third of all candidates in the first run and is not traded.
  tradeable: [premarket, regular]

volume_curve:
  # Cumulative fraction of an average day's volume traded by each time.
  #
  # Without this, relative volume compares volume-so-far against a FULL day's
  # average, so a genuine 5x morning reads as 0.4 at 10am and the threshold
  # can only clear late in the session - which hides exactly the premarket and
  # early-session setups worth trading. Values between anchors are
  # interpolated linearly.
  #
  # These are market-wide approximations. A per-symbol profile would be more
  # accurate and costs 20 days of minute bars per symbol to build.
  "04:00": 0.002
  "08:00": 0.015
  "09:30": 0.030
  "10:00": 0.160
  "11:00": 0.270
  "12:00": 0.350
  "13:00": 0.420
  "14:00": 0.500
  "15:00": 0.610
  "16:00": 1.000
  "20:00": 1.020
