# Rules for paper-trading the mosquito feed.
#
# Every number here is a first guess. They exist to be corrected by what the
# paper log shows, not to be trusted. The rejection reasons in
# data/mosquito/trades.jsonl are the fastest way to find the wrong one: if
# almost everything is skipped for "float unknown", that is the threshold to
# change, not the strategy.

universe:
  min_price: 0.10
  max_price: 20.00
  # Real float from the feed, not SEC shares-outstanding. This can be much
  # tighter than the old 30M proxy because the number is actually right.
  max_float: 20_000_000
  min_daily_volume: 500_000

approval:
  # Ask before entering. EXITS ARE NEVER GATED — a stop that waits for a tap
  # is not a stop, so only entries reach this queue.
  #
  # OFF for paper trading, ON before live. Paper risks nothing, so a gate
  # adds no safety there — and it would quietly cancel every premarket
  # signal, since a 04:00 request times out unanswered while you are asleep.
  # That would waste the exact window the SIP subscription was bought for.
  enabled: true

  # Which setups need a human. Leave a setup out and it fires automatically.
  #
  # Worth thinking about per setup rather than all-or-nothing: "spike" is
  # the vertical move, and 60 seconds of deliberation means the move is over
  # before you tap. If you keep it here, expect most spikes to expire
  # unanswered — which is itself a finding worth having.
  require_for: [spike, repeat, new_high]

  # A pending request always resolves, so the queue cannot grow overnight and
  # then fire a dozen stale orders when you look at your phone.
  timeout_seconds: 120
  on_timeout: reject           # reject | approve

  port: 8765                   # the phone page, on your local network

risk:
  risk_per_trade_pct: 0.5        # of equity, so a stop costs this much
  max_position_pct: 10.0         # ceiling regardless of how tight the stop is
  max_concurrent: 3

  # Flatten and stop for the day past this drawdown. Counts UNREALISED loss,
  # not just realised — on 2026-08-20 nothing ever closed, so a realised-only
  # cap sat satisfied while the account fell 10%.
  max_daily_loss_pct: 2.0
  fallback_equity: 50_000        # only used if the account query fails

execution:
  # Applied to positions found at the broker that this process did not open,
  # after a restart. Their original stop and target are unrecoverable, so
  # these rebuild them from the entry price. Approximate management beats
  # none — an unmanaged position has no stop at all.
  adopted_stop_pct: 12.0
  adopted_target_pct: 25.0

  entry_slippage_pct: 2.0        # limit placed this far above the alert price
  hard_exit_time: "15:50"        # nothing carries overnight in v1

# --- Setups ------------------------------------------------------------
# Each needs a stop wide enough to survive normal movement in these names.
# The six-month study put median adverse excursion near -5% and the 25th
# percentile near -11%, so anything under ~8% is inside the noise.

spike:
  # The vertical move. Rate, not cumulative gain.
  min_pct_change: 10.0
  min_rel_volume_1m: 15.0        # this minute vs the day's average minute
  min_float_turnover: 1.0        # whole float has changed hands today
  stop_pct: 12.0
  target_pct: 25.0

repeat:
  # Your "seen it two or three times" rule, using the feed's own counter.
  min_alert_count: 3
  min_pct_change: 5.0
  min_float_turnover: 0.5
  stop_pct: 10.0
  target_pct: 20.0

new_high:
  # NSH is the feed's tag for a new session high.
  min_pct_change: 5.0
  min_rel_volume_1m: 8.0
  stop_pct: 10.0
  target_pct: 20.0
